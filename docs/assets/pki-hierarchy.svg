<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">PKI certificate hierarchy</title>
  <desc id="desc">The attested root CA signs two standard X.509 intermediate CA certificates. The Device Enrollment Subroot issues VM certificates, and the Evidence Subroot signs evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 650 18px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .root { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .subroot { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.8; }
      .leaf { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="24" fill="url(#background)"/>
  <text x="720" y="42" text-anchor="middle" class="title">PKI certificate hierarchy</text>

  <g filter="url(#shadow)">
    <rect x="70" y="82" width="1300" height="700" rx="22" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
    <path d="M92 82 H1348 A22 22 0 0 1 1370 104 V132 H70 V104 A22 22 0 0 1 92 82 Z" fill="url(#header)"/>
  </g>

  <!-- Root -->
  <g>
    <rect x="500" y="175" width="440" height="90" rx="16" class="root"/>
    <text x="720" y="211" text-anchor="middle" class="label">Root CA</text>
    <text x="720" y="237" text-anchor="middle" class="small">Self-signed · hardware evidence</text>
  </g>

  <!-- Standard X.509 intermediate CAs -->
  <g>
    <rect x="150" y="390" width="470" height="94" rx="16" class="subroot"/>
    <text x="385" y="427" text-anchor="middle" class="label">Device Enrollment Subroot</text>
    <text x="385" y="453" text-anchor="middle" class="small">Standard X.509 intermediate CA</text>

    <rect x="820" y="390" width="470" height="94" rx="16" class="subroot"/>
    <text x="1055" y="427" text-anchor="middle" class="label">Evidence Subroot</text>
    <text x="1055" y="453" text-anchor="middle" class="small">Standard X.509 intermediate CA</text>

    <path d="M720 265 V326 H385 V388" class="flow"/>
    <path d="M720 265 V326 H1055 V388" class="flow"/>
  </g>

  <!-- Issued objects -->
  <g>
    <rect x="150" y="620" width="470" height="94" rx="16" class="leaf"/>
    <text x="385" y="657" text-anchor="middle" class="label">VM certificates</text>
    <text x="385" y="683" text-anchor="middle" class="small">Attested node identities</text>

    <rect x="820" y="620" width="470" height="94" rx="16" class="leaf"/>
    <text x="1055" y="657" text-anchor="middle" class="label">Evidence signatures</text>
    <text x="1055" y="683" text-anchor="middle" class="small">Signed evidence</text>

    <path d="M385 484 V618" class="flow"/>
    <path d="M1055 484 V618" class="flow"/>
  </g>
</svg>

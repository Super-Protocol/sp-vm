<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">Reference measurement verification</title>
  <desc id="desc">A normalized mrEnclave is calculated from verified CPU evidence and checked against values obtained from the trusted registry. Attestation continues only when the value is allowed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 650 17px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .tiny { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .input { fill: #fff; stroke: #cbd5e1; stroke-width: 1.6; }
      .verify { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.8; }
      .registry { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.8; }
      .decision { fill: #fffbeb; stroke: #fbbf24; stroke-width: 1.8; }
      .result { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .reject { fill: #fef2f2; stroke: #f87171; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1440" height="840" rx="24" fill="url(#background)"/>
  <text x="720" y="42" text-anchor="middle" class="title">Reference measurement verification</text>

  <g filter="url(#shadow)">
    <rect x="70" y="82" width="1300" height="720" rx="22" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
    <path d="M92 82 H1348 A22 22 0 0 1 1370 104 V132 H70 V104 A22 22 0 0 1 92 82 Z" fill="url(#header)"/>
  </g>

  <!-- Evidence branch -->
  <g>
    <rect x="130" y="175" width="390" height="82" rx="14" class="input"/>
    <text x="325" y="208" text-anchor="middle" class="label">Verified CPU evidence</text>
    <text x="325" y="232" text-anchor="middle" class="small">Hardware verification passed</text>

    <rect x="130" y="330" width="390" height="90" rx="14" class="verify"/>
    <text x="325" y="365" text-anchor="middle" class="label">Calculate normalized mrEnclave</text>
    <text x="325" y="390" text-anchor="middle" class="small">TDX or SEV-SNP measurement algorithm</text>
    <path d="M325 257 V328" class="flow"/>
  </g>

  <!-- Registry branch -->
  <g>
    <rect x="920" y="330" width="390" height="90" rx="14" class="registry"/>
    <svg x="944" y="350" width="28" height="28" viewBox="0 0 28 28" aria-label="SuperProtocol">
      <rect width="28" height="28" rx="6" fill="#111"/>
      <path d="M5 18h3.2c2 0 3.2-1 3.9-3.1l2.8-8.1c.6-1.9 2-2.8 4-2.8H23v4h-2.9c-.8 0-1.3.4-1.6 1.3l-2.8 8.1c-1.1 3.1-3.3 4.6-6.5 4.6H5z" fill="#fff"/>
    </svg>
    <text x="1130" y="365" text-anchor="middle" class="label">Trusted mrEnclave registry</text>
    <text x="1130" y="390" text-anchor="middle" class="small">Allowed reference values</text>
  </g>

  <!-- Registry check -->
  <g>
    <rect x="500" y="510" width="440" height="92" rx="16" class="decision"/>
    <text x="720" y="545" text-anchor="middle" class="label">Check calculated mrEnclave</text>
    <text x="720" y="570" text-anchor="middle" class="small">Value is present in the trusted registry</text>

    <path d="M325 420 V464 H610 V508" class="flow"/>
    <path d="M1115 420 V464 H830 V508" class="flow"/>

    <rect x="500" y="690" width="440" height="64" rx="16" class="result"/>
    <text x="720" y="729" text-anchor="middle" class="label">Continue attestation</text>
    <path d="M720 602 V688" class="flow"/>
    <text x="734" y="651" class="tiny">allowed</text>

    <rect x="1020" y="520" width="300" height="72" rx="14" class="reject"/>
    <text x="1170" y="551" text-anchor="middle" class="label">Reject attestation</text>
    <text x="1170" y="573" text-anchor="middle" class="small">Value absent or registry unavailable</text>
    <path d="M940 556 H1018" class="flow"/>
    <text x="957" y="547" class="tiny">not allowed</text>
  </g>
</svg>

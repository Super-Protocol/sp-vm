# Azure Gen2 (Hyper-V) guest: SCSI (hv_storvsc) + NIC (hv_netvsc).
# Builtin so initramfs can see the OS disk. Harmless on KVM/GCP (drivers do not bind).
#
# 6.12 HYPERV_STORAGE cannot be =y while SCSI_FC_ATTRS=m. Do not request
# FC attrs here; merge-configs.sh disables them after merge.
CONFIG_CONNECTOR=y
CONFIG_HYPERV=y
CONFIG_HYPERV_STORAGE=y
CONFIG_HYPERV_NET=y

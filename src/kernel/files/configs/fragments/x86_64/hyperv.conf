# Azure Gen2 (Hyper-V) guest. Builtin so initramfs can see the OS disk.
# Harmless on KVM/GCP (drivers do not bind).
#
# TDX ConfidentialVM (DCeds_v6) exposes the OS disk as Hyper-V NVMe PCI
# (1414:b111), not only hv_storvsc. NIC is hv_netvsc (eth*).
# MICROSOFT_MANA is not listed here: it is invisible until PCI+HYPERV are
# on, so merge-configs.sh enables it after merge.
#
# 6.12 HYPERV_STORAGE cannot be =y while SCSI_FC_ATTRS=m. Do not request
# FC attrs here; merge-configs.sh disables them after merge.
CONFIG_CONNECTOR=y
CONFIG_HYPERV=y
CONFIG_HYPERV_TIMER=y
CONFIG_HYPERV_STORAGE=y
CONFIG_HYPERV_NET=y
CONFIG_PCI_HYPERV=y
CONFIG_PCI_HYPERV_INTERFACE=y

# Azure Gen2 (Hyper-V) guest: SCSI (hv_storvsc) + NIC (hv_netvsc).
# Builtin so initramfs can see provider_config and the kernel can DHCP (CONFIG_IP_PNP_DHCP)
# before userspace. Harmless on KVM/GCP (drivers do not bind).
#
# 6.12 HYPERV_STORAGE: depends on m || SCSI_FC_ATTRS != m. If FC attrs stay =m,
# storvsc cannot be builtin and Azure disks never appear in initramfs.
CONFIG_SCSI_FC_ATTRS=y
CONFIG_CONNECTOR=y
CONFIG_HYPERV=y
CONFIG_HYPERV_TIMER=y
CONFIG_HYPERV_UTILS=y
CONFIG_HYPERV_BALLOON=y
CONFIG_HYPERV_STORAGE=y
CONFIG_HYPERV_NET=y
CONFIG_HYPERV_VSOCKETS=y
CONFIG_PCI_HYPERV=y
CONFIG_PCI_HYPERV_INTERFACE=y
CONFIG_HYPERV_IOMMU=y
# Dasv5+ may expose MANA instead of / in addition to netvsc.
CONFIG_NET_VENDOR_MICROSOFT=y
CONFIG_MICROSOFT_MANA=y

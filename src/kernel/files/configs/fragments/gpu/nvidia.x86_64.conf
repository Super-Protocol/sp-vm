# Support mmconfig PCI config space access.
# It's used to enable the MMIO access method for PCIe devices.
CONFIG_PCI_MMCONFIG=y

# Support for loading modules.
# It is used to support loading GPU drivers.
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y

# CRYPTO_FIPS requires this config when loading modules is enabled.
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_KEY="certs/sp-vm-module-signing-cert.pem"

# Linux kernel version suffix
CONFIG_LOCALVERSION="-nvidia-gpu-confidential"

# Newer NVIDIA drivers need additional symbols
CONFIG_X86_MCE=y
CONFIG_ARCH_SUPPORTS_MEMORY_FAILURE=y
CONFIG_X86_SUPPORTS_MEMORY_FAILURE=y
CONFIG_MEMORY_FAILURE=y
CONFIG_MTRR=y
CONFIG_X86_PAT=y

# CC related configs 
CONFIG_CRYPTO_ECC=y
CONFIG_CRYPTO_ECDH=y
CONFIG_CRYPTO_ECDSA=y

# HGX B200 NVSwitch management is performed by NVLSM over the ConnectX-7
# bridge devices. Keep the matching drivers in-tree so the guest does not
# need the complete MOFED DKMS stack.
CONFIG_NET_VENDOR_MELLANOX=y
CONFIG_MLX5_CORE=m
CONFIG_MLX5_CORE_EN=y
CONFIG_INFINIBAND=m
CONFIG_INFINIBAND_USER_ACCESS=m
CONFIG_INFINIBAND_USER_MAD=m
CONFIG_INFINIBAND_ON_DEMAND_PAGING=y
CONFIG_MLX5_INFINIBAND=m

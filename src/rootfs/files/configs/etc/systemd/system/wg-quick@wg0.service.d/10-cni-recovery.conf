# Rebuild the flannel overlay whenever wg0 is (re-)created: `wg-quick down`
# deletes the interface, which cascade-deletes flannel.1 (a VXLAN device whose
# lower device is wg0) and every pod route, and flanneld never notices. SUP-350.
#
# `-` so a failed CNI recovery can never fail or block wg-quick@wg0 itself, and
# an explicit TimeoutStartSec so the hook's wait (<= 60 s) can never push the
# unit over its start timeout — systemd would then stop the unit, deleting wg0.
[Service]
TimeoutStartSec=180
ExecStartPost=-/usr/local/bin/sp-cni-after-wg0 wg0

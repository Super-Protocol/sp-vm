[Unit]
Wants=rdma-ndd.service
After=systemd-modules-load.service rdma-ndd.service
StartLimitIntervalSec=0

[Service]
ExecCondition=/usr/local/bin/sp-nvidia-fabricmanager-condition
ExecStartPre=
ExecStartPre=/usr/local/bin/sp-nvidia-wait-cx7-linkup
ExecStartPre=/usr/bin/nvidia-fabricmanager-start.sh --mode precheck
Restart=on-failure
RestartSec=15
TimeoutStartSec=900

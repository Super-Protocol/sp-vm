network:
  version: 2
  renderer: networkd
  ethernets:
    # KVM/GCP virtio: ens*, enp*
    virtio:
      match:
        name: "en*"
      dhcp4: yes
    # Azure Hyper-V netvsc keeps the legacy eth0 name (udev does not rename it to en*).
    hyperv:
      match:
        name: "eth*"
      dhcp4: yes

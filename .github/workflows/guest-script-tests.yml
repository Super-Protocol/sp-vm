name: guest script tests

# The image is built by a manually dispatched workflow on a self-hosted runner,
# so nothing in this repository runs on a pull request. The scripts under
# src/rootfs/files/configs and scripts/azure decide a node's PKI mode on every
# boot, and getting that wrong partitions or forks a swarm (SUP-655) — a fault
# that is only visible after rebooting a real VM. Their unit tests get a runner
# rather than relying on someone remembering to run them by hand. The same
# scripts also fix the lifetime of every certificate a swarm will ever hold, and
# nothing renews the chain (SUP-653), so the lifetime guard runs here too.
#
# src/swarm-scripts runs on the same boot and decides the swarm's long-lived
# secrets. Writing one of them twice rotates a key the swarm is already using
# (SUP-700), which only shows up as a node that can no longer join — so those
# tests get a runner as well.
on:
  pull_request:
    paths:
      - 'src/rootfs/files/configs/pki-service/**'
      - 'src/rootfs/tests/**'
      - 'src/swarm-scripts/**'
      - 'scripts/azure/cluster.sh'
      - 'scripts/azure/cluster_config.py'
      - '.github/workflows/guest-script-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/rootfs/files/configs/pki-service/**'
      - 'src/rootfs/tests/**'
      - 'src/swarm-scripts/**'
      - 'scripts/azure/cluster.sh'
      - 'scripts/azure/cluster_config.py'

permissions:
  contents: read

concurrency:
  group: guest-script-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (guest scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the scripts import at module scope
        # The guest image ships pyyaml; a runner does not.
        run: pip install --disable-pip-version-check pyyaml

      - name: Run the tests
        run: python -m unittest discover -s src/rootfs/tests -p 'test_*.py' -v

      - name: No certificate in the shipped template outlives its signer
        # The same check pki-cert-init.service runs before generating a chain. Keep it
        # as its own step so a template-only regression names itself in the log.
        run: |
          python3 src/rootfs/files/configs/pki-service/scripts/pki_configure_helper.py \
            validate-template \
            --template src/rootfs/files/configs/pki-service/conf/cert-gen-config-template.yaml

      - name: The helper compiles with warnings fatal
        # The helper only ever runs inside a guest, where a SyntaxWarning shows up as a
        # failed boot. Make it fail here instead.
        run: |
          python - <<'PY'
          import warnings
          warnings.simplefilter("error")
          path = "src/rootfs/files/configs/pki-service/scripts/pki_configure_helper.py"
          with open(path) as f:
              compile(f.read(), path, "exec")
          print("compiles clean, warnings fatal")
          PY

      - name: The cluster launcher parses
        run: bash -n scripts/azure/cluster.sh

  swarm-scripts:
    name: unittest (swarm bootstrap scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what swarm-cli.py imports at module scope
        # The guest image ships these; a runner does not. pysqlite backs the
        # throwaway database the CLI tests run against.
        run: pip install --disable-pip-version-check sqlalchemy pymysql

      - name: swarm-cli keeps the secrets a swarm already holds
        run: python -m unittest discover -s src/swarm-scripts/test -p 'test_*.py' -v

      - name: The bootstrap script mints each secret once
        run: bash src/swarm-scripts/test/test_initialize_secrets_rke2_token.sh

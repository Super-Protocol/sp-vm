name: pki config tests

# The cert-gen template and the helper that renders it decide the lifetime of every
# certificate a swarm will ever hold, and they are only exercised once — on a cloud's
# bootstrap node, where a mistake surfaces as an expired chain months later. The guard
# that rejects a certificate outliving its signer therefore runs here too, on the same
# code path the guest runs (SUP-653).
on:
  pull_request:
    paths:
      - 'src/rootfs/files/configs/pki-service/**'
      - 'src/rootfs/tests/test_pki_configure_helper.py'
      - '.github/workflows/pki-config-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/rootfs/files/configs/pki-service/**'
      - 'src/rootfs/tests/test_pki_configure_helper.py'

permissions:
  contents: read

concurrency:
  group: pki-config-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (pki configure helper)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the helper imports at module scope
        # The guest image ships PyYAML; a runner does not, and the helper cannot be
        # imported by its own tests without it.
        run: pip install --disable-pip-version-check pyyaml

      - name: Run the helper's tests
        working-directory: src/rootfs/tests
        run: python -m unittest discover -p 'test_*.py' -v

      - name: No certificate in the shipped template outlives its signer
        # The same check `pki-cert-init.service` runs before generating the chain. Keep
        # it as a separate step so a template-only regression names itself in the log.
        run: |
          python3 src/rootfs/files/configs/pki-service/scripts/pki_configure_helper.py \
            validate-template \
            --template src/rootfs/files/configs/pki-service/conf/cert-gen-config-template.yaml

      - name: The helper compiles with warnings fatal
        # The helper only ever runs inside a guest, where a SyntaxWarning shows up as a
        # failed boot. Make it fail here instead.
        run: |
          python - <<'PY'
          import warnings
          warnings.simplefilter("error")
          path = "src/rootfs/files/configs/pki-service/scripts/pki_configure_helper.py"
          with open(path) as f:
              compile(f.read(), path, "exec")
          print("compiles clean, warnings fatal")
          PY

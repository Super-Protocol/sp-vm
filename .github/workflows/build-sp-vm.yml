name: Build SuperProtocol OS image
on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: true
        type: choice
        description: github runner for build
        options:
          - self-hosted
          - sp-vm-runner-2
          - ubuntu-latest
      build-type:
        required: true
        type: choice
        description: type of build to run
        options:
          - debug
          - release
      upload-to-storj:
        required: false
        type: boolean
        default: true
        description: Upload image artifacts to Storj
      upload-to-gcp:
        required: false
        type: boolean
        default: false
        description: Upload image to GCP bucket and create compute image
      upload-to-azurecr:
        required: false
        type: boolean
        default: false
        description: Push image artifacts to Azure Container Registry
jobs:
  build-asset:
    runs-on: ${{ inputs.runs-on }}
    env:
      S3_BUCKET: "builds-vm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download swarm-db schema
        env:
          GH_TOKEN: ${{ secrets.SWARM_CLOUD_SWARM_DB_REPO_RO }}
          SWARM_DB_SCHEMA_RELEASE: schema-v1.1.0
          SWARM_DB_SCHEMA_SHA256: cf20aa0329c0738c5995a7e3e36b1cc16f6714dfcd94ec795954e19430c76715
        run: |
          set -eu
          mkdir -p swarm-db-schema
          rel_file="$(mktemp)"
          curl -sfL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Super-Protocol/swarm-cloud/releases/tags/${SWARM_DB_SCHEMA_RELEASE}" \
            -o "$rel_file"
          asset_id="$(python3 -c "
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          for a in data.get('assets', []):
              if a.get('name') == 'schema.yaml':
                  print(a['id'])
                  break
          else:
              raise SystemExit('asset schema.yaml not found')
          " "$rel_file")"
          rm -f "$rel_file"
          curl -sfL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o swarm-db-schema/schema.yaml \
            "https://api.github.com/repos/Super-Protocol/swarm-cloud/releases/assets/${asset_id}"
          printf '%s  %s\n' "$SWARM_DB_SCHEMA_SHA256" swarm-db-schema/schema.yaml | sha256sum --check -

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set SP_VM_IMAGE_VERSION variable
        run: |
          echo "SP_VM_IMAGE_VERSION=build-${{ github.run_number }}-${{ inputs.build-type }}" >> "$GITHUB_ENV"

      - name: Setup builder
        run: |
          if docker buildx inspect insecure-builder >/dev/null 2>&1; then
              echo "Builder is already created";
              exit 0;
          fi
          docker buildx create \
              --use \
              --name insecure-builder \
              --buildkitd-flags '--allow-insecure-entitlement security.insecure';

      - name: Build sp-vm image
        run: |
          # Persistent self-hosted Buildx otherwise reuses kernel_builder and can
          # ship a virtio-only kernel (CONFIG_HYPERV unset) after fragment changes.
          docker buildx build \
              -t sp-vm \
              --allow security.insecure \
              --no-cache-filter kernel_builder,initramfs_builder \
              src \
              --output type=local,dest=./out \
              --build-context swarm_db_schema=./swarm-db-schema \
              --build-arg "SP_VM_IMAGE_VERSION=$SP_VM_IMAGE_VERSION" \
              --build-arg "SP_VM_BUILD_TYPE=${{ inputs.build-type }}" \
              --build-arg "S3_BUCKET=$S3_BUCKET";

      - name: Upload files to Storj
        if: ${{ inputs.upload-to-storj }}
        working-directory: out
        run: |
          function upload_file() {
              local FILE="${1:=""}";
              if [[ -z "$FILE" ]] || [[ ! -f "$FILE" ]]; then
                  echo "File $FILE not found";
                  exit 1;
              fi
              echo "Uploading $FILE to ${S3_BUCKET}/${SP_VM_IMAGE_VERSION}/"
              rclone copy \
                  --multi-thread-streams 8 \
                  --s3-provider Storj \
                  --s3-endpoint=gateway.storjshare.io \
                  "--s3-access-key-id=${{ secrets.S3_ACCESS_KEY }}" \
                  "--s3-secret-access-key=${{ secrets.S3_SECRET_KEY }}" \
                  "$FILE" \
                  ":s3:${S3_BUCKET}/${SP_VM_IMAGE_VERSION}/";
          }
          upload_file "sp-vm-${SP_VM_IMAGE_VERSION}.img";
          upload_file "OVMF.fd";
          upload_file "OVMF_AMD.fd";
          upload_file "OVMF_TDX.fd";
          upload_file "vm.json";
          upload_file "vmlinuz";
          upload_file "rootfs_hash.txt";

      - name: Authenticate to GCP
        if: ${{ inputs.upload-to-gcp }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_IMAGE_UPLOADER }}

      - name: Set up Cloud SDK
        if: ${{ inputs.upload-to-gcp }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload image to GCP and create compute image
        if: ${{ inputs.upload-to-gcp }}
        working-directory: out
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_IMAGE_UPLOADER }}
        run: |
          GCP_PROJECT_ID="$(echo "${GCP_SA_JSON}" | jq -r '.project_id')"
          GCS_BUCKET="gs://supa-swarm-bucket-conf-vms"
          IMAGE_NAME="sp-vm-${SP_VM_IMAGE_VERSION}"
          TAR_BASENAME="${IMAGE_NAME}.tar.gz"
          SOURCE_URI="${GCS_BUCKET}/${TAR_BASENAME}"

          if command -v pigz >/dev/null 2>&1; then
            TAR_COMPRESS="pigz -p $(nproc)"
          else
            echo "WARNING: pigz not found, falling back to single-threaded gzip"
            TAR_COMPRESS="gzip"
          fi

          mkdir -p tmpdir
          echo "==> Copying image as disk.raw"
          cp -f "sp-vm-${SP_VM_IMAGE_VERSION}.img" tmpdir/disk.raw

          echo "==> Packing disk.raw into ${TAR_BASENAME}"
          (cd tmpdir && tar -S --use-compress-program="${TAR_COMPRESS}" -cf "${TAR_BASENAME}" disk.raw)
          mv "tmpdir/${TAR_BASENAME}" .
          rm -rf tmpdir

          echo "==> Uploading ${TAR_BASENAME} to GCS: ${SOURCE_URI}"
          gsutil \
            -o "GSUtil:parallel_composite_upload_threshold=150MB" \
            -o "GSUtil:parallel_composite_upload_component_size=50MB" \
            -m cp "${TAR_BASENAME}" "${GCS_BUCKET}/"

          echo "==> Creating GCP compute image: ${IMAGE_NAME}"
          gcloud compute images create "${IMAGE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --source-uri "${SOURCE_URI}" \
            --guest-os-features "UEFI_COMPATIBLE,TDX_CAPABLE,SEV_CAPABLE,SEV_SNP_CAPABLE,GVNIC" \
            --labels "build_tag=${SP_VM_IMAGE_VERSION}" \
            --description "Built from Super-Protocol/sp-vm ${SP_VM_IMAGE_VERSION}"

          echo "==> Cleaning up temporary GCS object"
          gsutil rm "${SOURCE_URI}"

      - name: Push image to Azure Container Registry
        if: ${{ inputs.upload-to-azurecr }}
        working-directory: out
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
        run: |
          if [[ -z "${AZURE_CONTAINER_REGISTRY}" ]]; then
            echo "Secret AZURE_CONTAINER_REGISTRY is not set" >&2
            exit 1
          fi
          if [[ -z "${AZURE_CREDENTIALS}" ]]; then
            echo "Secret AZURE_CREDENTIALS is not set" >&2
            exit 1
          fi

          ACR_NAME="${AZURE_CONTAINER_REGISTRY%.azurecr.io}"
          LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          IMAGE="${LOGIN_SERVER}/sp-vm:${SP_VM_IMAGE_VERSION}"

          CLIENT_ID="$(echo "${AZURE_CREDENTIALS}" | jq -r '.clientId // .appId // empty')"
          CLIENT_SECRET="$(echo "${AZURE_CREDENTIALS}" | jq -r '.clientSecret // .password // empty')"
          if [[ -z "${CLIENT_ID}" || -z "${CLIENT_SECRET}" ]]; then
            echo "AZURE_CREDENTIALS must contain clientId and clientSecret" >&2
            exit 1
          fi

          echo "==> Logging in to ACR ${LOGIN_SERVER}"
          echo "${CLIENT_SECRET}" | docker login "${LOGIN_SERVER}" \
            --username "${CLIENT_ID}" \
            --password-stdin

          echo "==> Building OCI image ${IMAGE} from disk image only"
          mkdir -p acr-context
          cp -f "sp-vm-${SP_VM_IMAGE_VERSION}.img" "acr-context/sp-vm-${SP_VM_IMAGE_VERSION}.img"
          printf '%s\n' 'FROM scratch' "COPY sp-vm-${SP_VM_IMAGE_VERSION}.img /" > acr-context/Dockerfile
          docker build -t "${IMAGE}" acr-context
          rm -rf acr-context

          echo "==> Pushing ${IMAGE}"
          docker push "${IMAGE}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SP_VM_IMAGE_VERSION }}
          name: ${{ env.SP_VM_IMAGE_VERSION }}
          draft: false
          prerelease: true
          files: |
            out/vm.json

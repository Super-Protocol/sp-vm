name: Publish Reference Values (CoRIM)

# Regenerates and publishes the signed Reference Values of an sp-vm release
# that already exists. The build workflow produces them automatically for every
# new release; this workflow is for re-publishing - most often after a
# reference-evidence bundle for Intel TDX or an Azure CVM has been committed
# under reference-values/evidence/<build>/.
#
# Reference-values/README.md documents the format, the signing key and the
# procedure a customer follows to reproduce the values.

on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: true
        type: choice
        description: github runner for the job
        options:
          - self-hosted
          - sp-vm-runner-2
      build:
        required: true
        type: string
        description: "sp-vm build id, e.g. build-448-release"
      attach-to-release:
        required: false
        type: boolean
        default: true
        description: Attach the generated files to the GitHub release of that build

jobs:
  reference-values:
    runs-on: ${{ inputs.runs-on }}
    env:
      S3_BUCKET: "builds-vm"
      SP_VM_BUILD: ${{ inputs.build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the commit of the release tag
        run: |
          set -eu
          # The job runs on the current default branch so that the generator is
          # the newest one, but the manifest must record the commit the release
          # was actually built from, not this run's HEAD.
          git fetch --no-tags --depth 1 origin \
              "refs/tags/${SP_VM_BUILD}:refs/tags/${SP_VM_BUILD}"
          COMMIT="$(git rev-parse "refs/tags/${SP_VM_BUILD}^{commit}")"
          echo "Release ${SP_VM_BUILD} was built from ${COMMIT}"
          echo "SP_VM_COMMIT=${COMMIT}" >> "$GITHUB_ENV"

      - name: Download the release artifacts from Storj
        run: |
          set -eu
          mkdir -p out
          for FILE in vm.json rootfs_hash.txt OVMF_AMD.fd vmlinuz; do
              rclone copy \
                  --multi-thread-streams 8 \
                  --s3-provider Storj \
                  --s3-endpoint=gateway.storjshare.io \
                  "--s3-access-key-id=${{ secrets.S3_ACCESS_KEY }}" \
                  "--s3-secret-access-key=${{ secrets.S3_SECRET_KEY }}" \
                  ":s3:${S3_BUCKET}/${SP_VM_BUILD}/${FILE}" \
                  out/
          done
          ls -l out

      - name: Generate, sign and verify the Reference Values
        uses: ./.github/actions/reference-values
        with:
          build: ${{ inputs.build }}
          artifact-dir: out
          out-dir: reference-values-out
          signing-jwk: ${{ secrets.REFERENCE_VALUES_SIGNING_JWK }}
          public-jwk-path: reference-values/keys/sp-vm-reference-values.pub.jwk
          sp-vm-commit: ${{ env.SP_VM_COMMIT }}

      - name: Upload the Reference Values as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reference-values-${{ inputs.build }}
          path: |
            reference-values-out/reference-values.json
            reference-values-out/sp-vm-${{ inputs.build }}.corim.json
            reference-values-out/sp-vm-${{ inputs.build }}.corim.cbor
            reference-values-out/sp-vm-${{ inputs.build }}.corim-unsigned.cbor
          if-no-files-found: error

      - name: Attach the Reference Values to the release
        if: ${{ inputs.attach-to-release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.build }}
          draft: false
          prerelease: true
          files: |
            reference-values-out/reference-values.json
            reference-values-out/sp-vm-${{ inputs.build }}.corim.json
            reference-values-out/sp-vm-${{ inputs.build }}.corim.cbor
            reference-values-out/sp-vm-${{ inputs.build }}.corim-unsigned.cbor

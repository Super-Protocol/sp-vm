name: sp-vm Reference Values
description: >-
  Compute the Reference Values of an sp-vm build, encode them as a CoRIM, sign
  the CoRIM with the Reference-Values key and verify the signature.

inputs:
  build:
    description: "sp-vm build id, e.g. build-448-release"
    required: true
  artifact-dir:
    description: Build output directory containing vm.json
    required: true
  out-dir:
    description: Where to write the manifest and the CoRIM
    required: true
  signing-jwk:
    description: >-
      Reference-Values signing key in JWK format. When empty the CoRIM is left
      unsigned instead of failing, so a missing key never blocks a build.
    required: false
    default: ""
  public-jwk-path:
    description: Published public key the signature is verified against
    required: false
    default: reference-values/keys/sp-vm-reference-values.pub.jwk
  sp-vm-commit:
    description: >-
      sp-vm commit the release was built from, recorded in the manifest as
      provenance. Defaults to the commit this workflow runs on, which is only
      correct when the Reference Values are generated by the build itself; a
      re-publication must pass the commit of the release tag.
    required: false
    default: ${{ github.sha }}
  cocli-version:
    description: Version of Veraison cocli used to encode and sign the CoRIM
    required: false
    default: v1.1.2

runs:
  using: composite
  steps:
    - name: Set up Go for cocli
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"
        cache: false

    - name: Install the reference-values tooling
      shell: bash
      run: |
        set -eu
        python3 -m pip install --quiet --user --no-warn-script-location \
            -r "${{ github.workspace }}/reference-values/requirements.txt"
        echo "$(python3 -c 'import site; print(site.USER_BASE)')/bin" >> "$GITHUB_PATH"
        go install "github.com/veraison/corim/cocli@${{ inputs.cocli-version }}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Generate the Reference Values and the unsigned CoRIM
      shell: bash
      env:
        PYTHONPATH: ${{ github.workspace }}/reference-values
      run: |
        set -eu
        python3 -m spref generate \
            --build "${{ inputs.build }}" \
            --artifact-dir "${{ inputs.artifact-dir }}" \
            --evidence-dir "${{ github.workspace }}/reference-values/evidence" \
            --out-dir "${{ inputs.out-dir }}" \
            --sp-vm-commit "${{ inputs.sp-vm-commit }}"

    - name: Sign the CoRIM with the Reference-Values key
      shell: bash
      env:
        PYTHONPATH: ${{ github.workspace }}/reference-values
        SIGNING_JWK: ${{ inputs.signing-jwk }}
      run: |
        set -eu
        if [[ -z "${SIGNING_JWK}" ]]; then
            echo "::warning::REFERENCE_VALUES_SIGNING_JWK is not set; publishing an unsigned CoRIM"
            exit 0
        fi
        KEY_FILE="$(mktemp)"
        trap 'rm -f "$KEY_FILE"' EXIT
        printf '%s' "${SIGNING_JWK}" > "$KEY_FILE"
        python3 -m spref sign --in-dir "${{ inputs.out-dir }}" --key "$KEY_FILE"

    - name: Verify the signature with the published public key
      shell: bash
      env:
        PYTHONPATH: ${{ github.workspace }}/reference-values
        SIGNING_JWK: ${{ inputs.signing-jwk }}
      run: |
        set -eu
        SIGNED="${{ inputs.out-dir }}/sp-vm-${{ inputs.build }}.corim.cbor"
        UNSIGNED="${{ inputs.out-dir }}/sp-vm-${{ inputs.build }}.corim-unsigned.cbor"
        PUBLIC="${{ github.workspace }}/${{ inputs.public-jwk-path }}"

        if [[ -z "${SIGNING_JWK}" ]]; then
            echo "no signing key was used; nothing to verify"
            exit 0
        fi
        if [[ ! -f "${PUBLIC}" ]]; then
            echo "::error::${PUBLIC} is missing; the signed CoRIM cannot be verified against the published key"
            exit 1
        fi
        python3 -m spref verify --corim "${SIGNED}" --key "${PUBLIC}" --expect-payload "${UNSIGNED}"

    - name: Summarise the published values
      shell: bash
      run: |
        set -eu
        {
          echo "### Reference Values for ${{ inputs.build }}"
          echo
          echo '```json'
          cat "${{ inputs.out-dir }}/reference-values.json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
